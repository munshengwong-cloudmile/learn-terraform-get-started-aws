name: Terraform Deploy Pipeline

on:
  push:
    branches:
      - main # Runs automatically when you push to the main branch

jobs:
  terraform:
    name: 'Terraform Plan and Apply'
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code onto the GitHub server
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Terraform and authenticate with Terraform Cloud
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      # 3. Authenticate with AWS using your GitHub Secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      # 4. Initialize the Terraform working directory
      - name: Terraform Init
        run: terraform init

      # 5. Generate and show the execution plan
      - name: Terraform Plan
        run: terraform plan

      # 6. Apply the changes automatically (only runs on the main branch)
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: terraform apply -auto-approve